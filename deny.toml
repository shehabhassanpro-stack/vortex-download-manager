# Vortex Download Manager — cargo-deny Policy (P0-T07 / ADR-013 / Engineering-Standards.md §6)
# Enforces GPL-3.0-or-later license compatibility, blocks GPL-2.0-only / AGPL / proprietary licenses,
# audits security advisories, bans wildcard dependencies, and locks crate sources to crates.io.

[graph]
targets = [
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
]
all-features = false
no-default-features = false

[advisories]
ignore = []

[licenses]
# Explicitly allowed licenses compatible with GPL-3.0-or-later (Engineering-Standards.md §6).
# Any license not listed here (including GPL-2.0-only, AGPL, SSPL, BSL, or unlicensed) is denied.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Zlib",
    "BSL-1.0",
    "Unicode-3.0",
    "CC0-1.0",
    "GPL-3.0-or-later",
    "LGPL-3.0-or-later",
    "CDLA-Permissive-2.0",
    "OpenSSL",
]
confidence-threshold = 0.8
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
