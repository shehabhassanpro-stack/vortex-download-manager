[workspace]
resolver = "3"
members = [
    # Level 0 — Zero internal dependencies
    "crates/vortex-error",
    # Level 1 — Pure domain & observability
    "crates/vortex-observability",
    "crates/vortex-domain",
    # Level 2 — Application ports & use cases
    "crates/vortex-application",
    # Level 3 — Engine, infrastructure adapters & IPC
    "crates/vortex-engine",
    "crates/vortex-net",
    "crates/vortex-storage",
    "crates/vortex-io",
    "crates/vortex-ipc",
    "crates/vortex-platform",
    # Level 4 — Applications (thin binaries & composition root)
    "apps/bridge",
    "apps/desktop/src-tauri",
    # Engineering & verification tools
    "tools/arch-check",
    "tools/test-lab",
    "tools/bench",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "GPL-3.0-or-later"
authors = ["Shehab Hassan <shehab.hassan.pro@gmail.com>"]
repository = "https://github.com/shehabhassanpro-stack/vortex-download-manager"

[workspace.lints.rust]
unsafe_code = "warn"
missing_docs = "warn"
rust_2024_compatibility = { level = "deny", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
await_holding_lock = "deny"
large_futures = "warn"

[workspace.dependencies]
# Internal workspace crates
vortex-error = { version = "0.1.0", path = "crates/vortex-error" }
vortex-observability = { version = "0.1.0", path = "crates/vortex-observability" }
vortex-domain = { version = "0.1.0", path = "crates/vortex-domain" }
vortex-application = { version = "0.1.0", path = "crates/vortex-application" }
vortex-engine = { version = "0.1.0", path = "crates/vortex-engine" }
vortex-net = { version = "0.1.0", path = "crates/vortex-net" }
vortex-storage = { version = "0.1.0", path = "crates/vortex-storage" }
vortex-io = { version = "0.1.0", path = "crates/vortex-io" }
vortex-ipc = { version = "0.1.0", path = "crates/vortex-ipc", default-features = false }
vortex-platform = { version = "0.1.0", path = "crates/vortex-platform" }
vortex-test-lab = { version = "0.1.0", path = "tools/test-lab" }

# Core serialization, errors, IDs & secrets
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
specta = { version = "=2.0.0-rc.28", features = ["derive"] }
specta-typescript = "=0.0.15"
tauri = { version = "2", features = ["tray-icon"] }
tauri-build = "2"
tauri-plugin-notification = "2"
tauri-specta = { version = "=2.0.0-rc.29", features = ["derive", "typescript"] }
thiserror = "2.0"
uuid = { version = "1.16", features = ["v7", "serde"] }
url = "2.5"
secrecy = { version = "0.10", features = ["serde"] }
zeroize = { version = "1.8", features = ["derive"] }
bytes = "1.10"
smallvec = { version = "1.15", features = ["serde"] }
async-trait = "0.1"
rustc-hash = "2.1"
ahash = "0.8"
nucleo-matcher = "0.3"
mimalloc = { version = "0.1", default-features = false }
base64 = "0.22"

# Hashing & Persistence
rusqlite = { version = "0.43", features = ["bundled", "backup"] }
blake3 = "1.8"
sha1 = "0.10"
md-5 = "0.10"

# Observability & logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt", "registry"] }
flate2 = "1.1"
time = { version = "0.3", features = ["formatting", "macros"] }

# Protobuf & IPC
prost = "0.13"
prost-build = "0.13"

# Async, networking & test-lab
futures-core = "0.3"
tokio = { version = "1.45", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "signal", "process", "fs"] }
tokio-util = { version = "0.7", features = ["rt"] }
axum = "0.8"
http = "1.3"
httpdate = "1.0"
hyper = { version = "1.6", features = ["full"] }
hyper-util = { version = "0.1", features = ["tokio", "client-legacy", "http1"] }
http-body-util = "0.1"
socket2 = { version = "0.6", features = ["all"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-platform-verifier = "0.7"
hickory-resolver = { version = "0.26", default-features = false, features = ["tokio", "system-config"] }
sha2 = "0.11"
hex = "0.4"

# Windows Win32 APIs (zero-overhead FFI bindings)
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_Power",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

# Tooling & Testing
toml = "0.8"
proptest = "1.6"
tempfile = "3.19"
criterion = { version = "0.5", features = ["html_reports"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
# CRITICAL (ADR-004 / ADR-015): Keep unwind so Supervisor catches Actor panics via JoinError::is_panic()
panic = "unwind"

[profile.release.package.vortex-bridge]
opt-level = "z"
