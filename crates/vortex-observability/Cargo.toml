[package]
name = "vortex-observability"
description = "Structured tracing, non-blocking rotating JSONL logs, Flight Recorder, dynamic reload, redaction, and local metrics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = ["full"]
full = ["dep:url", "dep:tracing", "dep:tracing-subscriber", "dep:time"]

[dependencies]
vortex-error.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
secrecy.workspace = true
zeroize.workspace = true
flate2.workspace = true
url = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
time = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
