<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <!-- Deep obsidian squircle tile (anti-halation dark glass) -->
    <linearGradient id="vtx-bg" x1="48" y1="32" x2="464" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E2438" />
      <stop offset="52%" stop-color="#121624" />
      <stop offset="100%" stop-color="#0B0E18" />
    </linearGradient>

    <!-- Subtle inner top rim highlight -->
    <linearGradient id="vtx-rim" x1="256" y1="16" x2="256" y2="496" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A5B4FC" stop-opacity="0.42" />
      <stop offset="45%" stop-color="#6366F1" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0.28" />
    </linearGradient>

    <!-- Ambient core energy glow -->
    <radialGradient id="vtx-glow" cx="50%" cy="48%" r="44%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.42" />
      <stop offset="48%" stop-color="#6366F1" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0" />
    </radialGradient>

    <!-- Primary Kinetic Turbine Blade Gradient (Indigo -> Luminous Cyan) -->
    <linearGradient id="vtx-blade-a" x1="0%" y1="100%" x2="100%" y2="0%" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#4338CA" />
      <stop offset="42%" stop-color="#6366F1" />
      <stop offset="78%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#CFFAFE" />
    </linearGradient>

    <!-- Secondary Kinetic Turbine Blade Gradient (Electric Violet -> Indigo -> Cyan) -->
    <linearGradient id="vtx-blade-b" x1="0%" y1="100%" x2="100%" y2="0%" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="44%" stop-color="#818CF8" />
      <stop offset="80%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#A5F3FC" />
    </linearGradient>

    <!-- Core Ring Gradient -->
    <linearGradient id="vtx-core" x1="0%" y1="0%" x2="100%" y2="100%" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#CFFAFE" />
      <stop offset="48%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
  </defs>

  <!-- Rounded Squircle App Tile -->
  <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#vtx-bg)" />
  <rect x="24" y="24" width="464" height="464" rx="108" stroke="url(#vtx-rim)" stroke-width="8" />

  <!-- Subtle Radial Depth Glow -->
  <circle cx="256" cy="256" r="196" fill="url(#vtx-glow)" />

  <!-- Outer Precision Orbital Track -->
  <circle
    cx="256"
    cy="256"
    r="172"
    stroke="#818CF8"
    stroke-opacity="0.16"
    stroke-width="6"
    stroke-dasharray="28 18"
  />

  <!-- 3-Blade Symmetrical Kinetic Vortex Turbine -->
  <g transform="translate(256 256)">
    <!-- Blade 1 (0 deg) -->
    <path
      d="M -18 -56 C -8 -126, 66 -174, 146 -152 C 102 -128, 72 -96, 60 -42 C 52 -6, 32 16, 4 22 C 26 -6, 20 -36, -18 -56 Z"
      fill="url(#vtx-blade-a)"
    />
    <!-- Blade 2 (120 deg) -->
    <path
      transform="rotate(120)"
      d="M -18 -56 C -8 -126, 66 -174, 146 -152 C 102 -128, 72 -96, 60 -42 C 52 -6, 32 16, 4 22 C 26 -6, 20 -36, -18 -56 Z"
      fill="url(#vtx-blade-b)"
    />
    <!-- Blade 3 (240 deg) -->
    <path
      transform="rotate(240)"
      d="M -18 -56 C -8 -126, 66 -174, 146 -152 C 102 -128, 72 -96, 60 -42 C 52 -6, 32 16, 4 22 C 26 -6, 20 -36, -18 -56 Z"
      fill="url(#vtx-blade-a)"
    />

    <!-- Luminous Energy Core Ring -->
    <circle cx="0" cy="0" r="54" fill="#0E1320" stroke="url(#vtx-core)" stroke-width="10" />

    <!-- Crisp Minimalist Downward Acceleration Chevron -->
    <path
      d="M 0 -24 L 0 18 M -18 2 L 0 21 L 18 2"
      stroke="#E0F2FE"
      stroke-width="11"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>
