<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>إعدادات إضافة Vortex</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="options-container">
      <header class="options-header">
        <svg
          viewBox="0 0 512 512"
          width="40"
          height="40"
          fill="none"
          aria-hidden="true"
          class="brand-svg"
        >
          <defs>
            <linearGradient
              id="o-bg"
              x1="48"
              y1="32"
              x2="464"
              y2="480"
              gradientUnits="userSpaceOnUse"
            >
              <stop offset="0%" stop-color="#1E2438" />
              <stop offset="100%" stop-color="#0B0E18" />
            </linearGradient>
            <linearGradient id="o-blade" x1="0%" y1="100%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#4338CA" />
              <stop offset="45%" stop-color="#6366F1" />
              <stop offset="85%" stop-color="#22D3EE" />
              <stop offset="100%" stop-color="#CFFAFE" />
            </linearGradient>
          </defs>
          <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#o-bg)" />
          <g transform="translate(256 256)">
            <path
              d="M -18 -56 C -8 -126, 66 -174, 146 -152 C 102 -128, 72 -96, 60 -42 C 52 -6, 32 16, 4 22 C 26 -6, 20 -36, -18 -56 Z"
              fill="url(#o-blade)"
            />
            <path
              transform="rotate(120)"
              d="M -18 -56 C -8 -126, 66 -174, 146 -152 C 102 -128, 72 -96, 60 -42 C 52 -6, 32 16, 4 22 C 26 -6, 20 -36, -18 -56 Z"
              fill="url(#o-blade)"
            />
            <path
              transform="rotate(240)"
              d="M -18 -56 C -8 -126, 66 -174, 146 -152 C 102 -128, 72 -96, 60 -42 C 52 -6, 32 16, 4 22 C 26 -6, 20 -36, -18 -56 Z"
              fill="url(#o-blade)"
            />
            <circle cx="0" cy="0" r="54" fill="#0E1320" stroke="#22D3EE" stroke-width="10" />
            <path
              d="M 0 -24 L 0 18 M -18 2 L 0 21 L 18 2"
              stroke="#E0F2FE"
              stroke-width="12"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </g>
        </svg>
        <div>
          <h1>إعدادات التقاط Vortex للمتصفح</h1>
          <p class="subtitle">
            تتحكم هذه القواعد في التحميلات التي يعرضها Vortex للتأكيد الذكي بدون قطع اتصال المتصفح
            أو إضاعة روابط التحميل المؤقتة.
          </p>
        </div>
      </header>

      <form id="options-form" class="card">
        <label class="field">
          <span>الحد الأدنى لحجم الملف (ميجابايت)</span>
          <input id="min-size-mb" type="number" min="0" step="1" value="1" />
        </label>

        <label class="field">
          <span>الامتدادات الملتقطة (مفصولة بفاصلة)</span>
          <textarea id="extensions-input" rows="3" dir="ltr"></textarea>
        </label>

        <label class="field">
          <span>النطاقات المستثناة (سطر لكل نطاق، يدعم <code>*.domain.com</code>)</span>
          <textarea id="excluded-hosts" rows="4" dir="ltr"></textarea>
        </label>

        <label class="checkbox-row">
          <input id="incognito-toggle" type="checkbox" />
          <span>التقاط التحميلات في نوافذ التصفح الخفي (مغلق افتراضياً للخصوصية)</span>
        </label>

        <div class="actions-row">
          <button type="submit" class="btn-save">حفظ القواعد</button>
          <span id="save-status" role="status"></span>
        </div>
      </form>

      <section class="card">
        <div class="logs-header">
          <h2>سجل الأحداث المحلي المنظّف (آخر 500 حدث)</h2>
          <button id="refresh-logs" type="button" class="btn-outline">تحديث السجل</button>
        </div>
        <pre id="logs-view" class="logs-pre" dir="ltr"></pre>
      </section>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
