name: Security & License Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly supply-chain vulnerability sweep (Mondays 06:00 UTC)
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  rust-supply-chain:
    name: Cargo Deny & Cargo Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install cargo-deny and cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-audit

      - name: Verify GPL-3.0-or-later license compatibility, advisories & sources
        run: cargo deny check

      - name: Audit Rust dependencies against RustSec
        run: cargo audit

  node-supply-chain:
    name: pnpm Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run pnpm audit (high/critical gate)
        run: pnpm audit --audit-level=high

  codeql:
    name: CodeQL Static Security Analysis (${{ matrix.language }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: rust
            os: windows-latest
          - language: javascript-typescript
            os: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Protobuf compiler (protoc)
        if: matrix.language == 'rust'
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
